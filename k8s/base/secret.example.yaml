# Example only — DO NOT commit a real Secret. Use SealedSecrets, External
# Secrets Operator, or kubectl create secret --from-literal in CI.
apiVersion: v1
kind: Secret
metadata:
  name: video-rag-secrets
  namespace: video-rag
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_64_CHAR_RANDOM"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_KEY"
  DATABASE_URL: "postgresql+asyncpg://USER:PW@postgres:5432/videorag"
  DATABASE_URL_SYNC: "postgresql+psycopg2://USER:PW@postgres:5432/videorag"
  REDIS_URL: "redis://redis:6379/0"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  S3_BUCKET: ""
