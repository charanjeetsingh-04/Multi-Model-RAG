# Shared PVCs for uploads + vector store.
# Use a RWX storage class in production (EFS/Filestore/Azure Files) so both
# the backend and worker can write concurrently. For S3-backed storage, drop
# the uploads PVC and switch STORAGE_BACKEND=s3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: video-rag
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 200Gi } }
  storageClassName: efs-sc      # replace with your RWX class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectors-pvc
  namespace: video-rag
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 50Gi } }
  storageClassName: efs-sc
