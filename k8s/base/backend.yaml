apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: video-rag
  labels: { app: backend }
spec:
  replicas: 3
  selector: { matchLabels: { app: backend } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: REGISTRY/video-rag-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: video-rag-config }
            - secretRef:    { name: video-rag-secrets }
          env:
            - { name: UPLOAD_DIR,        value: /data/uploads }
            - { name: VECTOR_STORE_DIR,  value: /data/vector_store }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 5
            failureThreshold: 60  # 5 min for model warmup
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: vectors, mountPath: /data/vector_store }
            - { name: hfcache, mountPath: /cache/hf }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: uploads-pvc } }
        - { name: vectors, persistentVolumeClaim: { claimName: vectors-pvc } }
        - { name: hfcache, emptyDir: { sizeLimit: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: video-rag
  labels: { app: backend }
spec:
  type: ClusterIP
  selector: { app: backend }
  ports:
    - { name: http, port: 80, targetPort: 8000 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: video-rag
spec:
  minAvailable: 2
  selector: { matchLabels: { app: backend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: video-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
